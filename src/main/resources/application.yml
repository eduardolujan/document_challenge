server:
  port: 8080



spring:
  servlet:
    multipart:
      max-file-size: 500MB
      max-request-size: 500MB
      enabled: true


  datasource:
    url: jdbc:postgresql://localhost:5432/challenge
    username: postgres
    password: password
    driver-class-name: org.postgresql.Driver

  jpa:
    show-sql: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: none
    properties:
      default_schema: document_schema


minio:
    endpoint: http://localhost:9000
    access-key: minio_user
    secret-key: minio_pass
    bucket-name: challenge
    region: us-east-1

